<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SIGSF</title>
<link rel="stylesheet" href="vendor/bootstrap/css/bootstrap.min.css">
<link rel="stylesheet" href="vendor/fontawesome/css/all.min.css">
<link rel="stylesheet" href="sigsf-ui.css">
<link rel="stylesheet" href="sigsf-anim.css">
<style>
  body { background: var(--sg-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; color: #fff; }
  .intro { text-align: center; animation: aparecer .7s ease-out both; }
  .marca { width: 4.5rem; height: 4.5rem; border-radius: 1rem; background: var(--sg-gold); color: var(--sg-ink); display: inline-flex; align-items: center; justify-content: center; font-size: 2rem; }
  .nombre { font-size: 2.2rem; font-weight: 700; letter-spacing: .12em; margin-top: 1rem; }
  .sub { color: #9fb0c8; font-size: .95rem; }
  .barra { width: 180px; height: 3px; background: rgba(255,255,255,.12); border-radius: 3px; margin: 1.5rem auto 0; overflow: hidden; }
  .barra span { display: block; height: 100%; width: 0; background: var(--sg-gold); animation: cargar 1.4s ease-in-out forwards; }
  @keyframes aparecer { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes cargar { to { width: 100%; } }
</style>
</head>
<body>
  <div class="intro">
    <span class="marca"><i class="fa-solid fa-landmark"></i></span>
    <div class="nombre">SIGSF</div>
    <div class="sub">Sistema Integral de Gestión de Servicios Financieros</div>
    <div class="barra"><span></span></div>
    <a href="welcome.html" class="btn btn-sm btn-link text-white-50 mt-3">Entrar ahora</a>
  </div>
  <script>
    var reducido = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    setTimeout(function () { location.replace('welcome.html'); }, reducido ? 200 : 1600);
  </script>
<script src="sigsf-anim.js"></script>
</body>
</html>
