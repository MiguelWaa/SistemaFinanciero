<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIGSF</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter',sans-serif; }
        html,body { height:100%; }
        body {
            min-height:100vh; display:flex; align-items:center; justify-content:center; overflow:hidden;
            background: radial-gradient(1000px 600px at 70% -10%, #1e3a8a 0%, transparent 60%),
                        radial-gradient(800px 500px at -10% 110%, #0ea5e9 0%, transparent 55%),
                        #0b1f46;
            color:#fff;
        }
        /* rejilla sutil de fondo */
        body::before {
            content:""; position:absolute; inset:0;
            background-image:linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px),
                             linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px);
            background-size:44px 44px; opacity:.5;
            -webkit-mask-image: radial-gradient(circle at center, #000 30%, transparent 75%);
                    mask-image: radial-gradient(circle at center, #000 30%, transparent 75%);
        }
        .intro { position:relative; text-align:center; z-index:1; }

        .logo-ring {
            width:130px; height:130px; margin:0 auto 26px; position:relative;
            display:flex; align-items:center; justify-content:center;
            animation: pop .9s cubic-bezier(.16,1,.3,1) both;
        }
        .logo-ring .ring {
            position:absolute; inset:0; border-radius:32px;
            background:linear-gradient(135deg,#2563eb,#60a5fa);
            box-shadow:0 20px 60px rgba(37,99,235,.5);
        }
        .logo-ring .ring::after {
            content:""; position:absolute; inset:-6px; border-radius:38px;
            border:2px solid rgba(96,165,250,.35);
            animation: halo 2.4s ease-in-out infinite;
        }
        .logo-ring i { position:relative; font-size:3.4rem; color:#fff; }

        .brand-name {
            font-size:3rem; font-weight:800; letter-spacing:6px; margin-bottom:8px;
            background:linear-gradient(90deg,#ffffff,#93c5fd);
            -webkit-background-clip:text; background-clip:text; color:transparent;
            opacity:0; animation: rise .8s ease .35s forwards;
        }
        .brand-sub {
            font-size:.92rem; color:#94a3b8; letter-spacing:1px; margin-bottom:38px;
            opacity:0; animation: rise .8s ease .6s forwards;
        }
        .brand-sub b { color:#cbd5e1; font-weight:600; }

        .loader-track {
            width:230px; height:5px; margin:0 auto 18px; background:rgba(255,255,255,.12);
            border-radius:6px; overflow:hidden; opacity:0; animation: rise .6s ease .8s forwards;
        }
        .loader-fill { height:100%; width:0; border-radius:6px; background:linear-gradient(90deg,#60a5fa,#34d399); animation: fill 3s ease-out .8s forwards; }
        .loading-text { font-size:.8rem; color:#64748b; letter-spacing:1px; opacity:0; animation: rise .6s ease 1s forwards; }

        .enter-btn {
            margin-top:26px; display:inline-flex; align-items:center; gap:9px;
            background:rgba(255,255,255,.08); color:#fff; border:1px solid rgba(255,255,255,.2);
            padding:11px 22px; border-radius:30px; font-size:.88rem; font-weight:600; text-decoration:none;
            opacity:0; animation: rise .6s ease 1.6s forwards; transition:background .2s, transform .15s;
        }
        .enter-btn:hover { background:rgba(255,255,255,.16); transform:translateY(-2px); }

        @keyframes pop { 0%{ transform:scale(.4) rotate(-8deg); opacity:0; } 100%{ transform:scale(1) rotate(0); opacity:1; } }
        @keyframes halo { 0%,100%{ transform:scale(1); opacity:.5; } 50%{ transform:scale(1.08); opacity:0; } }
        @keyframes rise { from{ opacity:0; transform:translateY(14px);} to{ opacity:1; transform:translateY(0);} }
        @keyframes fill { from{ width:0; } to{ width:100%; } }

        /* transición de salida */
        body.leaving .intro { animation: fadeOut .5s ease forwards; }
        @keyframes fadeOut { to { opacity:0; transform:scale(.97); } }

        @media (max-width:520px){ .brand-name{ font-size:2.2rem; letter-spacing:4px; } .logo-ring{ width:104px;height:104px; } .logo-ring i{ font-size:2.7rem; } }
    </style>
</head>
<body>
    <div class="intro">
        <div class="logo-ring">
            <div class="ring"></div>
            <i class="fa-solid fa-landmark"></i>
        </div>
        <div class="brand-name">SIGSF</div>
        <div class="brand-sub">Sistema Integral de Gestión de <b>Servicios Financieros</b></div>
        <div class="loader-track"><div class="loader-fill"></div></div>
        <div class="loading-text">Iniciando sistema…</div>
        <br>
        <a href="welcome.html" class="enter-btn" id="enterBtn">Entrar ahora <i class="fa-solid fa-arrow-right"></i></a>
    </div>

    <script>
        var NEXT = 'welcome.html';
        function go(){ document.body.classList.add('leaving'); setTimeout(function(){ window.location.href = NEXT; }, 480); }
        // Avance automático tras la presentación
        var timer = setTimeout(go, 3900);
        // O entrar de inmediato
        document.getElementById('enterBtn').addEventListener('click', function(e){ e.preventDefault(); clearTimeout(timer); go(); });
    </script>
</body>
</html>
