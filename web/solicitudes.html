<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SIGSF · Solicitudes de clientes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="vendor/bootstrap/css/bootstrap.min.css">
<link rel="stylesheet" href="vendor/fontawesome/css/all.min.css">
<link rel="stylesheet" href="sigsf-ui.css">
<link rel="stylesheet" href="sigsf-anim.css">
<style>
  .sol { border: 1px solid var(--sg-line); border-left: 4px solid var(--sg-warning); border-radius: .6rem; background: #fff; padding: .9rem 1rem; }
  .sol + .sol { margin-top: .6rem; }
  .sol.COMPLETADA { border-left-color: var(--sg-success); }
  .sol.ANULADA { border-left-color: var(--sg-danger); }
  .sol dl { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: .4rem 1rem; margin: .7rem 0 0; padding-top: .7rem; border-top: 1px dashed var(--sg-line); }
  .sol dt { font-size: .74rem; color: var(--sg-muted); font-weight: 400; }
  .sol dd { margin: 0; font-weight: 600; font-size: .86rem; }
</style>
</head>
<body>
<header class="sg-page-head">
  <div class="d-flex align-items-center"><span class="ico"><i class="fa-solid fa-inbox"></i></span>
    <div><h1>Solicitudes de clientes</h1><p>Lo que los clientes piden desde el portal: apruébalo o recházalo y administra sus accesos</p></div></div>
  <a class="btn btn-sm btn-outline-light" href="index.html"><i class="fa-solid fa-arrow-left me-1"></i>Volver al panel</a>
</header>

<div class="sg-wrap">
  <div class="sg-kpis" id="kpis"></div>
  <ul class="nav nav-underline" id="tabs">
    <li class="nav-item"><button class="nav-link active" data-tab="sol" type="button"><i class="fa-solid fa-inbox me-1"></i>Solicitudes</button></li>
    <li class="nav-item"><button class="nav-link" data-tab="cue" type="button"><i class="fa-solid fa-user-shield me-1"></i>Cuentas del portal</button></li>
  </ul>

  <section data-pane="sol">
    <div class="d-flex flex-wrap gap-2 justify-content-between align-items-center mb-3">
      <div class="btn-group" role="group" aria-label="Filtrar por estado" id="filtros">
        <button class="btn btn-sm btn-outline-primary active" data-f="PENDIENTE">Pendientes</button>
        <button class="btn btn-sm btn-outline-primary" data-f="COMPLETADA">Aprobadas</button>
        <button class="btn btn-sm btn-outline-primary" data-f="ANULADA">Rechazadas</button>
        <button class="btn btn-sm btn-outline-primary" data-f="">Todas</button>
      </div>
      <div class="input-group input-group-sm" style="max-width:320px"><span class="input-group-text"><i class="fa-solid fa-magnifying-glass"></i></span>
        <input class="form-control" type="search" id="buscar" placeholder="Cliente, documento, N°…" aria-label="Buscar"></div>
    </div>
    <div id="lista"><div class="sg-empty">Cargando…</div></div>
    <div class="d-flex justify-content-center mt-3"><button class="btn btn-light d-none" id="masSol">Ver más</button></div>
  </section>

  <section data-pane="cue" hidden>
    <div class="card">
      <div class="sg-toolbar">
        <div><h2 class="h6 mb-0">Permisos de acceso al portal</h2><div class="small text-muted">Activa o bloquea la cuenta con la que cada cliente entra al portal.</div></div>
        <div class="input-group input-group-sm search"><span class="input-group-text"><i class="fa-solid fa-magnifying-glass"></i></span>
          <input class="form-control" type="search" id="buscarC" placeholder="Buscar…" aria-label="Buscar cliente"></div>
      </div>
      <div class="table-wrap">
        <table class="table table-hover align-middle">
          <thead><tr><th>N°</th><th>Cliente</th><th>Documento</th><th>Teléfono</th><th>Estado</th><th class="text-end">Acceso</th></tr></thead>
          <tbody id="tablaC"><tr class="empty-row"><td colspan="6">Cargando…</td></tr></tbody>
        </table>
      </div>
    </div>
  </section>
</div>

<script src="vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="api.js"></script>
<script src="sigsf-ui.js"></script>
<script src="sigsf-anim.js"></script>
<script src="pages/solicitudes-1.js"></script>
</body>
</html>
