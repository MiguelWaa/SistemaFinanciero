<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SIGSF · Iniciar sesión</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:22px;
       background:linear-gradient(-45deg,#0f172a,#1e3a8a,#1e40af,#0c4a6e);background-size:400% 400%;animation:fondo 16s ease infinite;overflow:hidden;position:relative;}
  @keyframes fondo{0%{background-position:0% 50%;}50%{background-position:100% 50%;}100%{background-position:0% 50%;}}

  /* Burbujas flotantes de fondo */
  .burbuja{position:absolute;border-radius:50%;background:rgba(255,255,255,.07);animation:flotar 20s infinite ease-in-out;pointer-events:none;}
  .burbuja:nth-child(1){width:170px;height:170px;left:6%;top:14%;animation-delay:0s;}
  .burbuja:nth-child(2){width:110px;height:110px;right:10%;top:22%;animation-delay:-4s;}
  .burbuja:nth-child(3){width:220px;height:220px;right:16%;bottom:10%;animation-delay:-8s;}
  .burbuja:nth-child(4){width:90px;height:90px;left:16%;bottom:16%;animation-delay:-12s;}
  .burbuja:nth-child(5){width:140px;height:140px;left:44%;top:6%;animation-delay:-6s;}
  @keyframes flotar{0%,100%{transform:translate(0,0) scale(1);}33%{transform:translate(26px,-34px) scale(1.09);}66%{transform:translate(-22px,22px) scale(.93);}}

  .caja{width:100%;max-width:430px;position:relative;z-index:2;animation:entrar .75s cubic-bezier(.22,1,.36,1) both;}
  @keyframes entrar{from{opacity:0;transform:translateY(34px) scale(.96);}to{opacity:1;transform:none;}}

  .marca{text-align:center;margin-bottom:22px;}
  .logo{width:74px;height:74px;border-radius:21px;background:linear-gradient(135deg,#3b82f6,#1d4ed8);display:flex;align-items:center;justify-content:center;
        font-size:2rem;color:#fff;margin:0 auto 14px;box-shadow:0 14px 36px rgba(37,99,235,.55);animation:latir 3.2s ease-in-out infinite;}
  @keyframes latir{0%,100%{transform:translateY(0) rotate(0);}50%{transform:translateY(-9px) rotate(-3deg);}}
  .marca h1{color:#fff;font-size:1.7rem;letter-spacing:.5px;}
  .marca p{color:rgba(255,255,255,.72);font-size:.88rem;margin-top:5px;}

  .tarjeta{background:rgba(255,255,255,.97);backdrop-filter:blur(14px);border-radius:22px;padding:32px 28px;box-shadow:0 26px 60px rgba(2,6,23,.45);}
  .tarjeta h2{font-size:1.28rem;text-align:center;color:#0f172a;}
  .tarjeta .lead{text-align:center;color:#64748b;font-size:.85rem;margin:5px 0 22px;}

  .campo{margin-bottom:17px;position:relative;animation:subir .55s ease both;}
  .campo:nth-of-type(1){animation-delay:.12s;} .campo:nth-of-type(2){animation-delay:.22s;}
  @keyframes subir{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:none;}}
  .campo label{display:block;font-size:.79rem;font-weight:700;color:#475569;margin-bottom:7px;}
  .envoltorio{position:relative;display:flex;align-items:center;}
  .envoltorio i.izq{position:absolute;left:14px;color:#94a3b8;font-size:.92rem;transition:.25s;}
  .envoltorio input{width:100%;padding:14px 44px;border:2px solid #e2e8f0;border-radius:13px;font-size:.95rem;transition:.25s;background:#f8fafc;color:#0f172a;}
  .envoltorio input:focus{outline:none;border-color:#2563eb;background:#fff;box-shadow:0 0 0 4px rgba(37,99,235,.13);transform:translateY(-2px);}
  .envoltorio input:focus ~ i.izq{color:#2563eb;transform:scale(1.15);}
  .ojo{position:absolute;right:13px;background:none;border:none;color:#94a3b8;cursor:pointer;font-size:.95rem;padding:5px;}
  .ojo:hover{color:#2563eb;}

  .fila{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;font-size:.84rem;}
  .fila label{color:#475569;display:flex;align-items:center;gap:7px;cursor:pointer;}
  .fila a{color:#2563eb;text-decoration:none;font-weight:600;}
  .fila a:hover{text-decoration:underline;}

  .entrar{width:100%;padding:15px;border:none;border-radius:13px;background:linear-gradient(135deg,#3b82f6,#1d4ed8);color:#fff;font-weight:700;font-size:1rem;
          cursor:pointer;position:relative;overflow:hidden;transition:.25s;box-shadow:0 9px 24px rgba(37,99,235,.4);}
  .entrar:hover{transform:translateY(-3px);box-shadow:0 15px 34px rgba(37,99,235,.55);}
  .entrar:active{transform:translateY(-1px);}
  .entrar:disabled{opacity:.75;cursor:wait;transform:none;}
  .entrar::after{content:'';position:absolute;top:0;left:-120%;width:60%;height:100%;
                 background:linear-gradient(90deg,transparent,rgba(255,255,255,.42),transparent);animation:brillo 3.4s infinite;}
  @keyframes brillo{0%{left:-120%;}55%,100%{left:130%;}}

  .aviso{display:none;align-items:center;gap:9px;padding:13px 15px;border-radius:12px;font-size:.85rem;margin-bottom:17px;}
  .aviso.err{display:flex;background:#fee2e2;color:#b91c1c;animation:temblar .45s;}
  .aviso.ok{display:flex;background:#dcfce7;color:#15803d;}
  @keyframes temblar{0%,100%{transform:translateX(0);}20%{transform:translateX(-9px);}40%{transform:translateX(9px);}60%{transform:translateX(-5px);}80%{transform:translateX(5px);}}

  .separador{display:flex;align-items:center;gap:12px;margin:22px 0 16px;color:#94a3b8;font-size:.77rem;}
  .separador::before,.separador::after{content:'';flex:1;height:1px;background:#e2e8f0;}

  .portal{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;padding:13px;border:2px solid #dbeafe;border-radius:13px;
          background:#fff;color:#2563eb;font-weight:700;font-size:.9rem;text-decoration:none;transition:.25s;}
  .portal:hover{background:#eff6ff;border-color:#93c5fd;transform:translateY(-2px);}

  .volver{display:block;text-align:center;margin-top:20px;color:rgba(255,255,255,.75);text-decoration:none;font-size:.85rem;transition:.2s;}
  .volver:hover{color:#fff;}
  .volver i{transition:.25s;display:inline-block;}
  .volver:hover i{transform:translateX(-5px);}
</style>
</head>
<body>
  <div class="burbuja"></div><div class="burbuja"></div><div class="burbuja"></div>
  <div class="burbuja"></div><div class="burbuja"></div>

  <div class="caja">
    <div class="marca">
      <div class="logo"><i class="fa-solid fa-building-columns"></i></div>
      <h1>SIGSF</h1>
      <p>Sistema Integral de Gestión de Servicios Financieros</p>
    </div>

    <div class="tarjeta">
      <h2>Iniciar sesión</h2>
      <p class="lead">Acceso para el personal de la entidad</p>

      <div class="aviso" id="aviso"><i class="fa-solid fa-circle-exclamation"></i><span id="avisoTxt"></span></div>

      <form id="loginForm" autocomplete="on">
        <div class="campo">
          <label for="user">Usuario o correo</label>
          <div class="envoltorio">
            <i class="fa-solid fa-user izq"></i>
            <input type="text" id="user" placeholder="admin@sigsf.com" autocomplete="username">
          </div>
        </div>

        <div class="campo">
          <label for="pass">Contraseña</label>
          <div class="envoltorio">
            <i class="fa-solid fa-lock izq"></i>
            <input type="password" id="pass" placeholder="••••••••" autocomplete="current-password">
            <button class="ojo" type="button" id="verPass" title="Mostrar u ocultar"><i class="fa-solid fa-eye-slash"></i></button>
          </div>
        </div>

        <div class="fila">
          <label><input type="checkbox" id="recordar"> Recordarme</label>
          <a href="#" id="olvide">¿Olvidaste tu contraseña?</a>
        </div>

        <button class="entrar" type="submit" id="btnEntrar">
          <span id="btnTxt">Ingresar</span> <i class="fa-solid fa-arrow-right-to-bracket"></i>
        </button>
      </form>

      <div class="separador">¿ERES CLIENTE?</div>
      <a href="portal.html" class="portal"><i class="fa-solid fa-user-shield"></i> Ingresar al Portal del Cliente</a>
    </div>

    <a href="welcome.html" class="volver"><i class="fa-solid fa-arrow-left"></i> Volver al inicio</a>
  </div>

<script src="api.js"></script>
<script>
(function(){
  var $=function(i){return document.getElementById(i);};
  var form=$('loginForm'), aviso=$('aviso'), btn=$('btnEntrar');

  function mostrar(txt, tipo){
    aviso.className='aviso '+tipo;
    $('avisoTxt').textContent=txt;
    aviso.querySelector('i').className = tipo==='ok' ? 'fa-solid fa-circle-check' : 'fa-solid fa-circle-exclamation';
  }
  function ocultar(){ aviso.className='aviso'; }

  // Mostrar/ocultar contraseña
  $('verPass').addEventListener('click', function(){
    var p=$('pass'), i=this.querySelector('i');
    if(p.type==='password'){ p.type='text'; i.className='fa-solid fa-eye'; }
    else { p.type='password'; i.className='fa-solid fa-eye-slash'; }
  });

  $('olvide').addEventListener('click', function(e){
    e.preventDefault();
    mostrar('Comunícate con el administrador del sistema para restablecerla.','ok');
  });

  // Aviso cuando se llega por sesión vencida o sin sesión
  try{
    var motivo = new URLSearchParams(location.search).get('motivo');
    if(motivo==='expirada') mostrar('Tu sesión expiró por inactividad. Ingresa nuevamente.','err');
    else if(motivo==='sesion') mostrar('Inicia sesión para acceder al sistema.','err');
  }catch(e){}

  // Recordar el último usuario
  try{
    var g=localStorage.getItem('sigsf_ultimo_usuario');
    if(g){ $('user').value=g; $('recordar').checked=true; }
  }catch(e){}

  form.addEventListener('submit', async function(e){
    e.preventDefault();
    var u=$('user').value.trim(), p=$('pass').value.trim();
    if(!u||!p){ mostrar('Completa tu usuario y contraseña para continuar.','err'); return; }
    ocultar();
    btn.disabled=true;
    $('btnTxt').textContent='Verificando…';
    btn.querySelector('i').className='fa-solid fa-spinner fa-spin';
    try{
      var usuario = await API.login(u,p);
      try{
        sessionStorage.setItem('sigsf_user', usuario.nombre || u);
        sessionStorage.setItem('sigsf_usuario', JSON.stringify(usuario));
        if($('recordar').checked) localStorage.setItem('sigsf_ultimo_usuario', u);
        else localStorage.removeItem('sigsf_ultimo_usuario');
      }catch(_){}
      mostrar('¡Bienvenido! Entrando al panel…','ok');
      $('btnTxt').textContent='Listo';
      btn.querySelector('i').className='fa-solid fa-check';
      setTimeout(function(){ window.location.href='index.html'; }, 600);
    }catch(ex){
      mostrar(ex.message || 'No se pudo iniciar sesión.','err');
      btn.disabled=false;
      $('btnTxt').textContent='Ingresar';
      btn.querySelector('i').className='fa-solid fa-arrow-right-to-bracket';
    }
  });
})();
</script>
</body>
</html>
