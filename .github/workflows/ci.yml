# ============================================================
#  SIGSF · Integración continua (GitHub Actions)
#  En cada push a main/develop y en cada Pull Request:
#    1. compila el backend (Java 17)
#    2. ejecuta las pruebas JUnit
#  Si una prueba falla, el PR queda en rojo y no debe fusionarse.
# ============================================================
name: CI SIGSF

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  compilar-y-probar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # historial completo: VersionService usa git describe

      - name: Instalar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compilar y ejecutar pruebas
        run: sh scripts/compilar_y_probar.sh
