name: Plan integrado SIGSF
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  memoria-api-navegador:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preparar dependencias
        run: |
          python scripts/preparar_dependencias.py
          cd pruebas/e2e
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Ejecutar JUnit, API, seguridad, sintaxis y E2E
        run: python scripts/validar_proyecto.py
      - name: Conservar evidencia incluso si hay errores
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencia-memoria-api-e2e
          path: pruebas/reportes/
          retention-days: 30
  integracion-postgresql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: sigsf_ci_temporal
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      SIGSF_DB_HOST: 127.0.0.1
      SIGSF_DB_PORT: '5432'
      SIGSF_DB_USER: postgres
      SIGSF_DB_PASSWORD: sigsf_ci_temporal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preparar y compilar
        run: |
          python scripts/preparar_dependencias.py
          python scripts/validar_proyecto.py --solo-junit
      - name: Instalar cliente de PostgreSQL
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Nueva BD aislada y siete pruebas JDBC
        run: python scripts/probar_postgresql.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencia-postgresql
          path: pruebas/reportes/postgresql/
