# ============================================================
#  SIGSF 5.11.0 · Proxy inverso HTTPS (Nginx) delante del servidor Java
#  El JAR escucha solo en 8091 (HTTP interno); Nginx termina TLS.
#     sudo cp deploy/nginx-sigsf.conf /etc/nginx/sites-available/sigsf
#     sudo ln -s /etc/nginx/sites-available/sigsf /etc/nginx/sites-enabled/
#     sudo nginx -t && sudo systemctl reload nginx
#  Certificado: certbot --nginx -d sigsf.ejemplo.pe (Let's Encrypt)
# ============================================================
upstream sigsf_app {
    server 127.0.0.1:8091;
    keepalive 16;
}

server {
    listen 80;
    server_name sigsf.ejemplo.pe;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name sigsf.ejemplo.pe;

    ssl_certificate     /etc/letsencrypt/live/sigsf.ejemplo.pe/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sigsf.ejemplo.pe/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    client_max_body_size 2m;        # coherente con server.max.cuerpo.kb
    server_tokens off;

    location / {
        proxy_pass http://sigsf_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    # Video y audio de bienvenida: permitir rangos (streaming)
    location ~* \.(mp4|mp3)$ {
        proxy_pass http://sigsf_app;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
    }
}
